name: fashionista-app

services:
  react-client:
    build:
      context: ./client
      args:
        REACT_APP_RAZORPAY_KEY_ID: ${REACT_APP_RAZORPAY_KEY_ID}
    ports:
      - "3000:8080"
    networks:
      - fashionista-public
    restart: always
    depends_on:
      node-express-api:
        condition: service_healthy

  node-express-api:
    build: ./api
    env_file:
    - .env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - fashionista-public
      - fashionista-private
    restart: always
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:14.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database-backup/seed_sql.sh:/docker-entrypoint-initdb.d/seed_sql.sh:ro
      - ./database-backup/ecommerce.dump:/docker-entrypoint-initdb.d/ecommerce.dump:ro
    networks:
      - fashionista-private
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10    

networks:
  fashionista-public:
  fashionista-private:
volumes:
  pgdata: